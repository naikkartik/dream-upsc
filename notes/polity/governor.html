<!-- PAGE 1 : INTRO & APPOINTMENT -->

<text x="330" y="20" text-anchor="middle" font-family="Kalam,cursive" font-size="17" font-weight="700" fill="#1e3a8a">GOVERNOR — Intro &amp; Appointment</text>
<line x1="85" y1="27" x2="575" y2="27" stroke="#1e3a8a" stroke-width="0.9"/>

<g filter="url(#hd1)" stroke="#1e3a8a" stroke-width="1.3" fill="none">
  <rect x="95" y="40" width="525" height="52" rx="2"/>
  <rect x="95" y="118" width="525" height="56" rx="2"/>
  <line x1="357" y1="92" x2="357" y2="118" marker-end="url(#p1)"/>
  <rect x="95" y="214" width="525" height="66" rx="2"/>
  <line x1="357" y1="174" x2="357" y2="214" marker-end="url(#p1)"/>
  <rect x="95" y="300" width="525" height="62" rx="2"/>
  <line x1="357" y1="280" x2="357" y2="300" marker-end="url(#p1)"/>
  <rect x="95" y="392" width="525" height="190" rx="2"/>
</g>

<text font-family="Kalam,cursive" fill="#1e3a8a">
  <tspan x="110" y="62" font-size="13" font-weight="700">STATE EXECUTIVE  (Part VI, Articles 153–167)</tspan>
  <tspan x="110" y="82" font-size="12">= Governor + Chief Minister + Council of Ministers + Advocate General · NO vice-governor</tspan>

  <tspan x="110" y="140" font-size="13" font-weight="700">GOVERNOR = chief executive head of the State</tspan>
  <tspan x="110" y="160" font-size="12">BUT nominal / titular head (like President) + AGENT of Centre  →  DUAL ROLE</tspan>

  <tspan x="110" y="236" font-size="13" font-weight="700">APPOINTMENT  (Art 155)</tspan>
  <tspan x="110" y="255" font-size="12">NOT elected — neither directly nor indirectly (unlike President)</tspan>
  <tspan x="110" y="273" font-size="12">Appointed by PRESIDENT by warrant under hand &amp; seal  =  nominee of the Centre</tspan>

  <tspan x="110" y="322" font-size="13" font-weight="700">★ Hargovind Pant case (1979)</tspan>
  <tspan x="110" y="341" font-size="12">Office of Governor is NOT an employment under the Centre — it is an</tspan>
  <tspan x="110" y="357" font-size="12">independent constitutional office, not subordinate to / under control of Centre</tspan>

  <tspan x="110" y="414" font-size="13" font-weight="700">Why APPOINTED, not ELECTED?  (Constituent Assembly reasons)</tspan>
  <tspan x="110" y="436" font-size="11.5">•  Direct election incompatible with parliamentary system in states</tspan>
  <tspan x="110" y="456" font-size="11.5">•  Likely to create conflict between Governor &amp; Chief Minister</tspan>
  <tspan x="110" y="476" font-size="11.5">•  Only a nominal head → no point in costly elaborate election</tspan>
  <tspan x="110" y="496" font-size="11.5">•  Elected Governor = party man, would not be neutral / impartial</tspan>
  <tspan x="110" y="516" font-size="11.5">•  Could create separatist tendencies → hurts unity &amp; stability</tspan>
  <tspan x="110" y="536" font-size="11.5">•  Presidential nomination lets Centre keep control over states</tspan>
  <tspan x="110" y="558" font-size="11.5" font-weight="700">→  American model (elected) DROPPED · Canadian model (appointed) ADOPTED</tspan>
</text>
<text x="110" y="600" font-family="Kalam,cursive" font-size="11" fill="#6b7280">7th Amendment Act, 1956 → same person can be Governor of 2 or more states.</text>
</svg>

<!-- PAGE 2 : QUALIFICATIONS · OATH · SARKARIA SELECTION -->
<svg viewBox="0 0 660 564" xmlns="http://www.w3.org/2000/svg"
     style="display:block;width:100%;margin-bottom:6px;border:0.5px solid #ccc;border-radius:2px" role="img">
<title>Qualifications, Oath &amp; Selection</title>
<defs>
  <pattern id="ru2" width="660" height="28" patternUnits="userSpaceOnUse">
    <line x1="0" y1="28" x2="660" y2="28" stroke="#b8d0e8" stroke-width="0.35" opacity="0.7"/>
  </pattern>
  <filter id="hd2" x="-8%" y="-8%" width="116%" height="116%">
    <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="3" seed="7" result="n"/>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="2" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
</defs>
<rect width="660" height="564" fill="#fefef8"/>
<rect width="660" height="564" fill="url(#ru2)"/>
<line x1="72" y1="0" x2="72" y2="564" stroke="#f87171" stroke-width="0.9" opacity="0.55"/>
<text x="330" y="20" text-anchor="middle" font-family="Kalam,cursive" font-size="17" font-weight="700" fill="#1e3a8a">Qualifications · Oath · Selection</text>
<line x1="85" y1="27" x2="575" y2="27" stroke="#1e3a8a" stroke-width="0.9"/>

<g filter="url(#hd2)" stroke="#1e3a8a" stroke-width="1.3" fill="none">
  <rect x="95" y="40" width="525" height="62" rx="2"/>
  <rect x="95" y="120" width="525" height="92" rx="2"/>
  <rect x="95" y="232" width="525" height="312" rx="2"/>
</g>

<text font-family="Kalam,cursive" fill="#1e3a8a">
  <tspan x="110" y="62" font-size="13" font-weight="700">QUALIFICATIONS  (Art 157) — only TWO</tspan>
  <tspan x="110" y="83" font-size="12">1.  Citizen of India</tspan>
  <tspan x="110" y="99" font-size="12">2.  Has completed 35 years of age</tspan>

  <tspan x="110" y="142" font-size="13" font-weight="700">OATH / AFFIRMATION</tspan>
  <tspan x="110" y="162" font-size="12">Administered by Chief Justice of State HC (in absence, senior-most judge avbl.)</tspan>
  <tspan x="110" y="180" font-size="12">Swears to: (a) faithfully execute the office</tspan>
  <tspan x="110" y="196" font-size="12">(b) preserve, protect &amp; defend the Constitution &amp; law  (c) devote to service &amp;</tspan>
  <tspan x="110" y="210" font-size="12">well-being of the people of the state</tspan>

  <tspan x="110" y="254" font-size="13" font-weight="700">SARKARIA COMMISSION (1983–88) — selection &amp; appointment</tspan>
  <tspan x="110" y="278" font-size="11.5" font-weight="700">A person to be Governor should:</tspan>
  <tspan x="110" y="300" font-size="11.5">(i)   be eminent in some walk of life</tspan>
  <tspan x="110" y="322" font-size="11.5">(ii)  be a person from OUTSIDE the state</tspan>
  <tspan x="110" y="344" font-size="11.5">(iii) be a detached figure, not intimately connected with local politics of state</tspan>
  <tspan x="110" y="366" font-size="11.5">(iv)  not have taken great part in politics, esp. in the recent past</tspan>
  <tspan x="110" y="392" font-size="11.5">•  A ruling-party (Centre) politician should NOT be Governor of a state run</tspan>
  <tspan x="110" y="408" font-size="11.5">   by another party / combination</tspan>
  <tspan x="110" y="432" font-size="11.5">•  Effective consultation with state CM → prescribe procedure by amending Art 155</tspan>
  <tspan x="110" y="456" font-size="11.5">•  VP of India &amp; Speaker of Lok Sabha may be consulted by PM in selecting Governor</tspan>
  <tspan x="110" y="478" font-size="11.5">•  Such consultation should be CONFIDENTIAL &amp; INFORMAL — not a constitutional</tspan>
  <tspan x="110" y="494" font-size="11.5">   obligation</tspan>
</text>
<text x="110" y="528" font-family="Kalam,cursive" font-size="11" fill="#6b7280">★ PYQ trap: only 2 qualifications in Constitution; rest are Sarkaria recommendations (non-binding).</text>
</svg>

<!-- PAGE 3 : CONDITIONS OF OFFICE · SALARY · IMMUNITIES -->
<svg viewBox="0 0 660 560" xmlns="http://www.w3.org/2000/svg"
     style="display:block;width:100%;margin-bottom:6px;border:0.5px solid #ccc;border-radius:2px" role="img">

<defs>
  <pattern id="ru3" width="660" height="28" patternUnits="userSpaceOnUse">

<text x="330" y="20" text-anchor="middle" font-family="Kalam,cursive" font-size="17" font-weight="700" fill="#1e3a8a">Conditions · Salary · Immunities</text>
<line x1="85" y1="27" x2="575" y2="27" stroke="#1e3a8a" stroke-width="0.9"/>

<g filter="url(#hd3)" stroke="#1e3a8a" stroke-width="1.3" fill="none">
  <rect x="95" y="40" width="525" height="196" rx="2"/>
  <rect x="95" y="256" width="250" height="64" rx="2"/>
  <rect x="95" y="340" width="525" height="180" rx="2"/>
</g>

<text font-family="Kalam,cursive" fill="#1e3a8a">
  <tspan x="110" y="62" font-size="13" font-weight="700">CONDITIONS OF OFFICE  (Art 158)</tspan>
  <tspan x="110" y="84" font-size="11.5">1.  Not a member of Parliament or state legislature — if so, deemed to have</tspan>
  <tspan x="110" y="100" font-size="11.5">     vacated that seat on the date he enters office as Governor</tspan>
  <tspan x="110" y="122" font-size="11.5">2.  Should not hold any other office of profit</tspan>
  <tspan x="110" y="144" font-size="11.5">3.  Entitled to use Raj Bhavan (official residence) WITHOUT payment of rent</tspan>
  <tspan x="110" y="166" font-size="11.5">4.  Emoluments, allowances &amp; privileges as determined by Parliament</tspan>
  <tspan x="110" y="188" font-size="11.5">5.  Same person for 2+ states → emoluments shared by states in proportion</tspan>
  <tspan x="110" y="204" font-size="11.5">     determined by the President</tspan>
  <tspan x="110" y="226" font-size="11.5">6.  Emoluments &amp; allowances CANNOT be diminished during his term</tspan>

  <tspan x="110" y="280" font-size="12" font-weight="700">SALARY (2018 ↑)</tspan>
  <tspan x="110" y="304" font-size="13" font-weight="700">₹1.10 L → ₹3.50 L / month</tspan>

  <tspan x="110" y="362" font-size="13" font-weight="700">PRIVILEGES &amp; IMMUNITIES (like President)</tspan>
  <tspan x="110" y="386" font-size="11.5">•  Personal immunity — no legal liability for his official acts</tspan>
  <tspan x="110" y="410" font-size="11.5">•  Immune from criminal proceedings — even for personal acts — during term</tspan>
  <tspan x="110" y="434" font-size="11.5">•  Cannot be arrested or imprisoned</tspan>
  <tspan x="110" y="458" font-size="11.5">•  Civil proceedings (personal acts) — only after 2 months' prior notice</tspan>
</text>
<text x="110" y="504" font-family="Kalam,cursive" font-size="11" fill="#6b7280">★ Remember the two "2 vs P": proportion of shared salary = President decides · 2 months notice = civil suits.</text>
</svg>

<!-- PAGE 4 : TERM OF OFFICE & REMOVAL -->

     style="display:block;width:100%;margin-bottom:6px;border:0.5px solid #ccc;border-radius:2px" role="img">
<title>Term of Office &amp; Removal</title>
<defs>
  <pattern id="ru4" width="660" height="28" patternUnits="userSpaceOnUse">
    <line x1="0" y1="28" x2="660" y2="28" stroke="#b8d0e8" stroke-width="0.35" opacity="0.7"/>

<rect width="660" height="590" fill="#fefef8"/>
<rect width="660" height="590" fill="url(#ru4)"/>
<line x1="72" y1="0" x2="72" y2="590" stroke="#f87171" stroke-width="0.9" opacity="0.55"/>
<text x="330" y="20" text-anchor="middle" font-family="Kalam,cursive" font-size="17" font-weight="700" fill="#1e3a8a">Term of Office &amp; Removal</text>
<line x1="85" y1="27" x2="575" y2="27" stroke="#1e3a8a" stroke-width="0.9"/>

<g filter="url(#hd4)" stroke="#1e3a8a" stroke-width="1.3" fill="none">
  <rect x="95" y="40" width="525" height="78" rx="2"/>
  <rect x="95" y="148" width="525" height="92" rx="2"/>
  <line x1="357" y1="118" x2="357" y2="148" marker-end="url(#p4)"/>
  <rect x="95" y="270" width="525" height="86" rx="2"/>
  <rect x="95" y="386" width="525" height="150" rx="2"/>
</g>

<text font-family="Kalam,cursive" fill="#1e3a8a">
  <tspan x="110" y="62" font-size="13" font-weight="700">TERM  (Art 156)</tspan>
  <tspan x="110" y="83" font-size="12">5 years from the date he enters upon office</tspan>
  <tspan x="110" y="101" font-size="12">BUT subject to the PLEASURE of the President · may resign anytime (letter to President)</tspan>

  <tspan x="110" y="170" font-size="13" font-weight="700">★ Surya Narain case (1981)</tspan>
  <tspan x="110" y="190" font-size="12">Pleasure of the President is NOT justiciable</tspan>
  <tspan x="110" y="208" font-size="12">Governor has NO security of tenure &amp; NO fixed term — removable any time</tspan>
  <tspan x="110" y="226" font-size="12">Constitution lays down NO grounds for removal</tspan>

  <tspan x="110" y="292" font-size="13" font-weight="700">HISTORICAL INSTANCES (mass change)</tspan>
  <tspan x="110" y="314" font-size="12">1989 — V.P. Singh (National Front) asked ALL governors (Congress-appointed) to resign</tspan>
  <tspan x="110" y="336" font-size="12">1991 — P.V. Narasimha Rao (Congress) changed 14 governors of V.P.Singh/Chandra Sekhar</tspan>

  <tspan x="110" y="408" font-size="13" font-weight="700">TRANSFER · REAPPOINTMENT · CONTINUITY</tspan>
  <tspan x="110" y="430" font-size="11.5">•  President may TRANSFER a Governor to another state for rest of term</tspan>
  <tspan x="110" y="452" font-size="11.5">•  May be REAPPOINTED in same or any other state after term expires</tspan>
  <tspan x="110" y="474" font-size="11.5">•  Holds office BEYOND 5 yrs until successor assumes charge (no interregnum)</tspan>
  <tspan x="110" y="496" font-size="11.5">•  Contingency (e.g. death of sitting Governor) → CJ of state HC appointed temporarily</tspan>
</text>
<text x="110" y="560" font-family="Kalam,cursive" font-size="11" fill="#6b7280">Idea: there must always be a Governor in the state — no vacuum allowed.</text>
</svg>

<!-- PAGE 5 : EXECUTIVE POWERS -->
<svg viewBox="0 0 660 640" xmlns="http://www.w3.org/2000/svg"
     style="display:block;width:100%;margin-bottom:6px;border:0.5px solid #ccc;border-radius:2px" role="img">
<title>Executive Powers of Governor</title>
<defs>
  <pattern id="ru5" width="660" height="28" patternUnits="userSpaceOnUse">
    <line x1="0" y1="28" x2="660" y2="28" stroke="#b8d0e8" stroke-width="0.35" opacity="0.7"/>

    <feDisplacementMap in="SourceGraphic" in2="n" scale="2" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
</defs>
<rect width="660" height="640" fill="#fefef8"/>
<rect width="660" height="640" fill="url(#ru5)"/>
<line x1="72" y1="0" x2="72" y2="640" stroke="#f87171" stroke-width="0.9" opacity="0.55"/>
<text x="330" y="20" text-anchor="middle" font-family="Kalam,cursive" font-size="17" font-weight="700" fill="#1e3a8a">Powers — 1. EXECUTIVE</text>
<line x1="85" y1="27" x2="575" y2="27" stroke="#1e3a8a" stroke-width="0.9"/>

<g filter="url(#hd5)" stroke="#1e3a8a" stroke-width="1.3" fill="none">
  <rect x="95" y="40" width="525" height="48" rx="2"/>
  <rect x="95" y="104" width="525" height="488" rx="2"/>
</g>

<text font-family="Kalam,cursive" fill="#1e3a8a">
  <tspan x="110" y="60" font-size="12">Governor has executive, legislative, financial &amp; judicial powers (≈ President)</tspan>
  <tspan x="110" y="78" font-size="12" font-weight="700">BUT no diplomatic, military or emergency powers like the President</tspan>

  <tspan x="110" y="128" font-size="11.5">1.  All executive actions of the state govt are formally taken in HIS name</tspan>
  <tspan x="110" y="150" font-size="11.5">2.  Makes rules specifying how orders/instruments in his name are authenticated</tspan>
  <tspan x="110" y="172" font-size="11.5">3.  Makes rules for convenient transaction of business &amp; allocation among ministers</tspan>
  <tspan x="110" y="194" font-size="11.5">4.  Appoints CM &amp; other ministers — hold office during his pleasure</tspan>
  <tspan x="110" y="210" font-size="11">     Tribal Welfare Minister in Chhattisgarh, Jharkhand, MP, Odisha</tspan>
  <tspan x="110" y="225" font-size="11">     (Bihar EXCLUDED from this by 94th Amendment Act, 2006)</tspan>
  <tspan x="110" y="247" font-size="11.5">5.  Appoints Advocate General &amp; fixes remuneration (holds office at his pleasure)</tspan>
  <tspan x="110" y="269" font-size="11.5">6.  Appoints State Election Commissioner &amp; fixes tenure</tspan>
  <tspan x="110" y="285" font-size="11">     (SEC removable only in like manner &amp; grounds as a High Court judge)</tspan>
  <tspan x="110" y="307" font-size="11.5">7.  Appoints Chairman &amp; members of State Public Service Commission</tspan>
  <tspan x="110" y="323" font-size="11">     (but they are removable only by the PRESIDENT, not by the Governor)</tspan>
  <tspan x="110" y="345" font-size="11.5">8.  Can seek information on administration &amp; legislative proposals from the CM</tspan>
  <tspan x="110" y="367" font-size="11.5">9.  Can require CM to submit a minister's decision (not considered by Council)</tspan>
  <tspan x="110" y="383" font-size="11">     for consideration of the Council of Ministers</tspan>
  <tspan x="110" y="405" font-size="11.5">10. Can recommend imposition of constitutional emergency (President's Rule)</tspan>
  <tspan x="110" y="421" font-size="11">     During President's Rule he enjoys extensive powers as AGENT of the President</tspan>
  <tspan x="110" y="443" font-size="11.5">11. Acts as CHANCELLOR of universities in the state &amp; appoints Vice-Chancellors</tspan>

  <tspan x="110" y="485" font-size="11.5" font-weight="700">★ Removal-power trap (who removes whom):</tspan>
  <tspan x="110" y="507" font-size="11">•  Advocate General — Governor's pleasure</tspan>
  <tspan x="110" y="527" font-size="11">•  State Election Commissioner — like a High Court judge</tspan>
  <tspan x="110" y="547" font-size="11">•  SPSC Chairman/members — only by President (on report of Supreme Court)</tspan>
  <tspan x="110" y="567" font-size="11">•  CM, ministers, Advocate General — during Governor's pleasure</tspan>
</text>
</svg>

<text font-family="Kalam,cursive" fill="#1e3a8a">
  <tspan x="110" y="64" font-size="12" font-weight="700">Governor is an INTEGRAL part of the state legislature</tspan>

  <tspan x="110" y="120" font-size="11.5">1.  Can summon &amp; prorogue the legislature, &amp; dissolve the legislative assembly</tspan>
  <tspan x="110" y="142" font-size="11.5">2.  Addresses the legislature — at the 1st session after each general election</tspan>
  <tspan x="110" y="158" font-size="11">     &amp; the 1st session of each year</tspan>
  <tspan x="110" y="180" font-size="11.5">3.  Can send messages to the House(s) re a pending bill or otherwise</tspan>
  <tspan x="110" y="202" font-size="11.5">4.  Appoints any member to PRESIDE over the assembly when both Speaker &amp;</tspan>
  <tspan x="110" y="218" font-size="11">     Deputy Speaker are vacant (similarly Council — Chairman &amp; Deputy Chairman)</tspan>
  <tspan x="110" y="240" font-size="11.5">5.  Nominates 1/6 of members of the Legislative Council — from persons with</tspan>
  <tspan x="110" y="256" font-size="11">     special knowledge of literature, science, art, cooperative movement, social service</tspan>
  <tspan x="110" y="278" font-size="11.5">6.  Nominated (before 2020) 1 member to the Assembly from Anglo-Indian community</tspan>
  <tspan x="110" y="294" font-size="11">     — DISCONTINUED by 104th Constitutional Amendment Act, 2019</tspan>
  <tspan x="110" y="316" font-size="11.5">7.  Decides on disqualification of members — in CONSULTATION with Election</tspan>
  <tspan x="110" y="332" font-size="11">     Commission</tspan>
  <tspan x="110" y="354" font-size="11.5">8.  Lays before the legislature the reports of:</tspan>

  <tspan x="110" y="394" font-size="11">     •  State Public Service Commission</tspan>

  <tspan x="110" y="446" font-size="11.5" font-weight="700">★ Numbers to lock: nominates 1/6 of Council · Anglo-Indian gone (104th Amdt 2019)</tspan>

<text font-family="Kalam,cursive" fill="#1e3a8a">
  <tspan x="110" y="62" font-size="13" font-weight="700">When a bill is passed &amp; sent to him — 4 options:</tspan>
  <tspan x="110" y="84" font-size="11.5">(a) Give assent → becomes an Act</tspan>
  <tspan x="110" y="106" font-size="11.5">(b) Withhold assent → bill ends</tspan>
  <tspan x="110" y="128" font-size="11.5">(c) Return bill (if NOT money bill) for reconsideration — if passed again</tspan>
  <tspan x="110" y="144" font-size="11">      (with/without amendments) he MUST assent  =  only a SUSPENSIVE veto</tspan>
  <tspan x="110" y="166" font-size="11.5">(d) Reserve the bill for the PRESIDENT — OBLIGATORY when bill endangers</tspan>
  <tspan x="110" y="182" font-size="11">      the position of the state High Court</tspan>

  <tspan x="110" y="228" font-size="12.5" font-weight="700">Soli Sorabji — Governor may ALSO reserve a bill if it is:</tspan>
  <tspan x="110" y="250" font-size="11.5">(i)   ultra-vires (against the Constitution)</tspan>
  <tspan x="110" y="272" font-size="11.5">(ii)  opposed to the Directive Principles of State Policy</tspan>
  <tspan x="110" y="294" font-size="11.5">(iii) against the larger interest of the country</tspan>
  <tspan x="110" y="316" font-size="11.5">(iv)  of grave national importance</tspan>
  <tspan x="110" y="336" font-size="11.5">(v)   dealing with compulsory acquisition of property under Art 31A</tspan>

  <tspan x="110" y="384" font-size="13" font-weight="700">ORDINANCE — "most important legislative power"</tspan>
  <tspan x="110" y="406" font-size="11.5">•  Can promulgate when the state legislature is NOT in session</tspan>
  <tspan x="110" y="428" font-size="11.5">•  Must be approved by legislature within 6 WEEKS of its reassembly</tspan>
  <tspan x="110" y="450" font-size="11.5">•  Can withdraw an ordinance at any time</tspan>

  <tspan x="110" y="506" font-size="13" font-weight="700">★ D.C. Wadhwa case (1986)</tspan>
  <tspan x="110" y="528" font-size="11.5">Bihar Governor promulgated 256 ordinances (1967–81), re-promulgated for</tspan>
  <tspan x="110" y="544" font-size="11.5">1–14 years without passing bills in Assembly</tspan>
  <tspan x="110" y="566" font-size="11.5" font-weight="700">→ SC: successive re-promulgation = unconstitutional ("ordinance raj")</tspan>
</text>

  <tspan x="110" y="306" font-size="13" font-weight="700">JUDICIAL POWERS</tspan>

  <tspan x="110" y="346" font-size="11">     commute the sentence of anyone convicted under a STATE law</tspan>
  <tspan x="110" y="370" font-size="11.5">2.  Is consulted by the President while appointing judges of the state High Court</tspan>
  <tspan x="110" y="394" font-size="11.5">3.  Makes appointments, postings &amp; promotions of DISTRICT judges in</tspan>

  <tspan x="110" y="434" font-size="11.5">4.  Appoints persons to the judicial service (other than district judges) in</tspan>
  <tspan x="110" y="450" font-size="11">     consultation with the High Court &amp; the State Public Service Commission</tspan>
</text>
<text x="110" y="524" font-family="Kalam,cursive" font-size="11" fill="#6b7280">★ Pardon trap: Governor's pardon = only state-law offences · CANNOT pardon a death sentence (next: Table 30.3).</text>

<text font-family="Kalam,cursive" fill="#1e3a8a">
  <tspan x="226" y="62" text-anchor="middle" font-size="13" font-weight="700">PRESIDENT</tspan>
  <tspan x="489" y="62" text-anchor="middle" font-size="13" font-weight="700">GOVERNOR</tspan>

  <tspan x="110" y="98" font-size="11.5" font-weight="700">Ordinary bill — alternatives:</tspan>
  <tspan x="110" y="120" font-size="11">3 options:</tspan>
  <tspan x="110" y="140" font-size="11">1. give assent</tspan>
  <tspan x="110" y="158" font-size="11">2. withhold assent</tspan>
  <tspan x="110" y="176" font-size="11">3. return for reconsideration</tspan>
  <tspan x="110" y="200" font-size="11">(no power to reserve —</tspan>
  <tspan x="110" y="216" font-size="11">it's a Central bill)</tspan>

  <tspan x="372" y="120" font-size="11" font-weight="700">4 options:</tspan>
  <tspan x="372" y="140" font-size="11">1. give assent</tspan>
  <tspan x="372" y="158" font-size="11">2. withhold assent</tspan>
  <tspan x="372" y="176" font-size="11">3. return for reconsideration</tspan>
  <tspan x="372" y="200" font-size="11" font-weight="700">4. RESERVE for the President</tspan>
  <tspan x="372" y="216" font-size="11">(extra option = key diff)</tspan>

  <tspan x="110" y="266" font-size="11.5" font-weight="700">Reserved bill (sent to President):</tspan>
  <tspan x="110" y="288" font-size="11">President has 3 alternatives —</tspan>
  <tspan x="110" y="306" font-size="11">assent / withhold / return to</tspan>
  <tspan x="110" y="324" font-size="11">House. If repassed, he MUST</tspan>
  <tspan x="110" y="342" font-size="11">assent = suspensive veto.</tspan>

  <tspan x="372" y="288" font-size="11">Once Governor reserves, he has</tspan>
  <tspan x="372" y="306" font-size="11" font-weight="700">NO further role.</tspan>
  <tspan x="372" y="324" font-size="11">If President returns &amp; House</tspan>
  <tspan x="372" y="342" font-size="11">repasses → goes to President</tspan>
  <tspan x="372" y="358" font-size="11">again (not Governor).</tspan>

  <tspan x="110" y="398" font-size="11.5" font-weight="700">Money bill — alternatives:</tspan>
  <tspan x="110" y="420" font-size="11">2 options:</tspan>
  <tspan x="110" y="440" font-size="11">1. give assent</tspan>
  <tspan x="110" y="458" font-size="11">2. withhold assent</tspan>
  <tspan x="110" y="480" font-size="11" font-weight="700">Cannot RETURN a money bill.</tspan>

  <tspan x="372" y="420" font-size="11" font-weight="700">3 options:</tspan>
  <tspan x="372" y="440" font-size="11">1. give assent</tspan>
  <tspan x="372" y="458" font-size="11">2. withhold assent</tspan>
  <tspan x="372" y="476" font-size="11" font-weight="700">3. RESERVE for the President</tspan>
  <tspan x="372" y="496" font-size="11">Cannot RETURN a money bill.</tspan>
  <tspan x="372" y="518" font-size="11">(money bill needs his prior</tspan>
  <tspan x="372" y="534" font-size="11">permission to be introduced)</tspan>
</text>
<text x="110" y="578" font-family="Kalam,cursive" font-size="11" fill="#6b7280">★ Core diff: only the GOVERNOR can RESERVE a bill (ordinary &amp; money) for the President; President cannot reserve.</text>

<text font-family="Kalam,cursive" fill="#1e3a8a">
  <tspan x="110" y="62" font-size="12.5" font-weight="700">SAME for both President &amp; Governor:</tspan>
  <tspan x="110" y="84" font-size="11">•  Only when legislature is NOT in session · force &amp; effect = an Act</tspan>
  <tspan x="110" y="104" font-size="11">•  Same limitations as an Act · invalid if it makes a provision legislature can't make</tspan>
  <tspan x="110" y="124" font-size="11">•  Can withdraw anytime · ceases 6 weeks after reassembly · NOT a discretionary</tspan>
  <tspan x="110" y="140" font-size="11">   power (only on advice of CoM) · co-extensive with the legislature's law power</tspan>

  <tspan x="110" y="196" font-size="13" font-weight="700">KEY DIFFERENCE — instructions from President</tspan>
  <tspan x="110" y="222" font-size="12">PRESIDENT:  needs NO instruction from anyone to make an ordinance.</tspan>

  <tspan x="110" y="256" font-size="12" font-weight="700">GOVERNOR:  CANNOT make an ordinance without President's</tspan>
  <tspan x="110" y="274" font-size="12" font-weight="700">instruction in THREE cases —</tspan>
  <tspan x="110" y="300" font-size="11.5">(a)  if a bill containing the same provisions would have required the</tspan>
  <tspan x="110" y="316" font-size="11.5">      previous SANCTION of the President for introduction in the legislature</tspan>
  <tspan x="110" y="342" font-size="11.5">(b)  if he would have deemed it necessary to RESERVE such a bill for the</tspan>
  <tspan x="110" y="358" font-size="11.5">      consideration of the President</tspan>
  <tspan x="110" y="384" font-size="11.5">(c)  if an Act of the state legislature with the same provisions would have</tspan>
  <tspan x="110" y="400" font-size="11.5">      been INVALID without the President's assent</tspan>

  <tspan x="110" y="438" font-size="11.5" font-weight="700">Co-extensive scope:</tspan>
  <tspan x="110" y="460" font-size="11">President → subjects on which PARLIAMENT can make laws</tspan>
  <tspan x="110" y="480" font-size="11">Governor → subjects on which the STATE LEGISLATURE can make laws</tspan>
  <tspan x="110" y="506" font-size="11">Governor's ordinance ceases earlier if disapproved by Assembly + agreed by Council.</tspan>
</text>

  <tspan x="372" y="122" font-size="11">Same set of powers, but —</tspan>
  <tspan x="372" y="140" font-size="11" font-weight="700">any offence vs STATE law</tspan>
  <tspan x="372" y="158" font-size="11">only</tspan>

  <tspan x="110" y="202" font-size="11" font-weight="700">Death sentence:</tspan>
  <tspan x="110" y="224" font-size="11">CAN pardon a death sentence.</tspan>
  <tspan x="110" y="244" font-size="11">He is the ONLY authority to</tspan>
  <tspan x="110" y="262" font-size="11">pardon a death sentence.</tspan>

  <tspan x="372" y="202" font-size="11" font-weight="700">CANNOT pardon death sentence.</tspan>
  <tspan x="372" y="222" font-size="11">Even if state law prescribes</tspan>
  <tspan x="372" y="240" font-size="11">death, pardon lies with President.</tspan>
  <tspan x="372" y="262" font-size="11">But CAN suspend / remit /</tspan>
  <tspan x="372" y="280" font-size="11">commute a death sentence.</tspan>

  <tspan x="110" y="334" font-size="11" font-weight="700">Court-martial (military):</tspan>
  <tspan x="110" y="356" font-size="11">CAN grant pardon, reprieve,</tspan>
  <tspan x="110" y="374" font-size="11">remission etc. for court-martial</tspan>
  <tspan x="110" y="392" font-size="11">sentences.</tspan>

  <tspan x="372" y="356" font-size="11" font-weight="700">Does NOT possess any such</tspan>
  <tspan x="372" y="374" font-size="11" font-weight="700">power (no court-martial).</tspan>
</text>
<text x="110" y="436" font-family="Kalam,cursive" font-size="11" fill="#6b7280">★ 2 things only President can do: pardon DEATH sentence &amp; court-martial sentences. Governor cannot.</text>
</svg>

<text x="330" y="20" text-anchor="middle" font-family="Kalam,cursive" font-size="17" font-weight="700" fill="#1e3a8a">Constitutional Position &amp; Discretion</text>
<line x1="85" y1="27" x2="575" y2="27" stroke="#1e3a8a" stroke-width="0.9"/>

<g filter="url(#hd12)" stroke="#1e3a8a" stroke-width="1.3" fill="none">

  <rect x="95" y="460" width="525" height="138" rx="2"/>
</g>

<text font-family="Kalam,cursive" fill="#1e3a8a">
  <tspan x="110" y="62" font-size="13" font-weight="700">NOMINAL head — real executive = CoM headed by CM</tspan>
  <tspan x="110" y="84" font-size="11.5">Art 154 — executive power vested in Governor (direct / through subordinates)</tspan>
  <tspan x="110" y="106" font-size="11.5">Art 163 — CoM with CM to aid &amp; advise Governor, except in his discretion</tspan>
  <tspan x="110" y="128" font-size="11.5">Art 164 — CoM collectively responsible to the Assembly</tspan>
  <tspan x="110" y="148" font-size="11">             (= foundation of the parliamentary system in the state)</tspan>

  <tspan x="110" y="194" font-size="13" font-weight="700">Differs from PRESIDENT in 2 respects:</tspan>
  <tspan x="110" y="216" font-size="11.5">1.  Constitution envisages Governor acting in DISCRETION — no such</tspan>
  <tspan x="110" y="232" font-size="11">     possibility envisaged for the President</tspan>
  <tspan x="110" y="254" font-size="11.5">2.  42nd Amdt (1976) made ministerial advice BINDING on President —</tspan>
  <tspan x="110" y="270" font-size="11">     NO such provision for the Governor</tspan>

  <tspan x="110" y="308" font-size="13" font-weight="700">CONSTITUTIONAL discretion (express)</tspan>
  <tspan x="110" y="330" font-size="11.5">1.  Reservation of a bill for the President's consideration</tspan>
  <tspan x="110" y="352" font-size="11.5">2.  Recommendation for imposition of President's Rule in the state</tspan>
  <tspan x="110" y="374" font-size="11.5">3.  Exercising functions as administrator of an adjoining UT (additional charge)</tspan>
  <tspan x="110" y="396" font-size="11.5">4.  Determining royalty to autonomous Tribal District Council — Assam,</tspan>
  <tspan x="110" y="412" font-size="11">     Meghalaya, Tripura &amp; Mizoram</tspan>
  <tspan x="110" y="434" font-size="11">     (His decision on what falls in discretion is FINAL &amp; not questionable)</tspan>

  <tspan x="110" y="482" font-size="13" font-weight="700">SITUATIONAL discretion (hidden / political)</tspan>
  <tspan x="110" y="504" font-size="11.5">1.  Appointment of CM — when no party has clear majority / CM dies suddenly</tspan>
  <tspan x="110" y="520" font-size="11">     with no obvious successor</tspan>
  <tspan x="110" y="542" font-size="11.5">2.  Dismissal of CoM — when it cannot prove confidence of the Assembly</tspan>
  <tspan x="110" y="564" font-size="11.5">3.  Dissolution of Assembly — if the CoM has lost its majority</tspan>
</text>
<text x="110" y="624" font-family="Kalam,cursive" font-size="11" fill="#6b7280">★ Articles trio for position: 154, 163, 164 · Governor = constitutional head + agent of Centre (dual role).</text>
</svg>

  <tspan x="110" y="62" font-size="13" font-weight="700">SPECIAL RESPONSIBILITIES (per President's directions)</tspan>
  <tspan x="110" y="86" font-size="11.5">1.  Maharashtra — separate development boards for Vidarbha &amp; Marathwada</tspan>
  <tspan x="110" y="110" font-size="11.5">2.  Gujarat — separate development boards for Saurashtra &amp; Kutch</tspan>
  <tspan x="110" y="134" font-size="11.5">3.  Nagaland — law &amp; order while disturbance in Naga Hills–Tuensang Area continues</tspan>
  <tspan x="110" y="158" font-size="11.5">4.  Assam — administration of tribal areas</tspan>
  <tspan x="110" y="182" font-size="11.5">5.  Manipur — administration of hill areas in the state</tspan>
  <tspan x="110" y="206" font-size="11.5">6.  Sikkim — peace &amp; social/economic advancement of different sections</tspan>
  <tspan x="110" y="230" font-size="11.5">7.  Arunachal Pradesh — law &amp; order in the state</tspan>
  <tspan x="110" y="254" font-size="11.5">8.  Karnataka — separate development board for Hyderabad-Karnataka region</tspan>
  <tspan x="110" y="278" font-size="11">Here he consults CoM but acts FINALLY in his discretion.</tspan>

  <tspan x="110" y="342" font-size="13" font-weight="700">ISSUES IN FUNCTIONING (Sarkaria Commission, 1983–88)</tspan>
  <tspan x="110" y="366" font-size="11.5">1.  Choosing CM — when no clear majority emerges after election</tspan>
  <tspan x="110" y="390" font-size="11.5">2.  Testing majority — lists of supporters vs physical head-counting (no uniformity)</tspan>
  <tspan x="110" y="414" font-size="11.5">3.  Dismissal of CM — no uniform criteria adopted</tspan>
  <tspan x="110" y="438" font-size="11.5">4.  Dissolving the Assembly — different approaches in similar situations</tspan>
  <tspan x="110" y="462" font-size="11.5">5.  Recommending President's Rule — often without exhausting alternatives;</tspan>
  <tspan x="110" y="478" font-size="11">     criticised as partisan</tspan>
  <tspan x="110" y="500" font-size="11.5">6.  Reserving bills for President's consideration — controversy in some cases</tspan>
  <tspan x="110" y="524" font-size="11.5">7.  Nominations to the Legislative Council — use of discretion criticised</tspan>
  <tspan x="110" y="548" font-size="11.5">8.  Exercise of discretion as CHANCELLOR of a university — criticised</tspan>
  <tspan x="110" y="572" font-size="11">     (acts under statute as Chancellor, not as Governor)</tspan>
